<text x="52" y="658" fill="#7a808c" font-size="12.5">実測＝ヤングマシン 0→1000m全開加速テスト（JARI城里テストセンター・同日・同一ライダー・2018年）。CBR250RRはテスト当時の2017年式（38PS）で、車重・出力は現行値（42PS・168kg）。車重はメーカー公表の装備重量。</text>
