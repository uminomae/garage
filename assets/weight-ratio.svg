<text x="54" y="848" fill="#ff9a6a" font-size="11.5">※<tspan font-weight="700">これはピーク値どうしの比で、一般道で使う回転域の話ではない。</tspan>低回転のトルクは非公表。減速比も未反映。“順位”より“桁感”で見ること。</text>
